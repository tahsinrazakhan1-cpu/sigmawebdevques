
<!-- Tutorial 25: Styling Lists
Task 1: Remove the default bullets from an unordered list.

Task 2: Change the list markers to "square" and move them inside the content area.

Task 3: Create a horizontal navigation bar by changing list items to inline. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>styling the list </title>
    <link rel="stylesheet" href="tut25.css">
</head>
<body>
    <!-- task 1  -->
     <h2>removing the default bullets points </h2>
     <ul class="no-bullets">
        <li>mango</li>
        <li>banana</li>
        <li>apple</li>


        <!-- Task 2  -->
        <ul class="sqrlist">
            <li>css</li>
            <li>html</li>
            <li>java</li>

        </ul>
        <!-- task 3  -->
         <h2> the horizantal navigation bar </h2>
         <ul class="navbar">
            <li><a href="#">home</a></li> 
            <br>
            <li><a href="#">about</a></li>
            <br>
            <li><a href="#">service</a></li><br>
            <li><a href="#">contact</a></li><br>

         </ul>
         
     </body>
     </html>
