<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Navbar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: #333;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        a {
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">MyLogo</div>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

</body>
</html>
