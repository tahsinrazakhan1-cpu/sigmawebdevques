<!-- Tutorial 17: CSS Selectors MasterClass

Task 1: Use the universal selector to set the margin and padding of every element to zero.

Task 2: Target all elements with a specific class and change their font size, but target one specific element by its ID to change its color.

Task 3: Group the h1, h2, and p selectors to give them all a shared border in a single CSS rule. -->
<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css selector master class</title>
    <link rel="stylesheet" href="tut17style.css">
    </style>

</head>
<body>
    <h1>this is first heading</h1>    
    <h2>this is second heading </h2>
    <p class="tect">this is a first para </p>
    <p class="text" id="special">tis is a second para </p>
</body>
</html>
