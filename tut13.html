<!-- Tutorial 13: Entities & Code Tags

Task 1: Display the text <h1>This is a heading</h1> literally on your webpage so the browser doesn't render it as a real heading.

Task 2: Write a code snippet on your page using the <code> tag and preserve its exact spacing using the <pre> tag.

Task 3: Use a non-breaking space entity to put 5 spaces between two words in a paragraph. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>entities and code tags</title>
</head>
<body>
    <h1>task 1 the display the html code literally</h1>
    <!-- task 1 -->
    <p> &lt;h1&gt;this is a heading &lt;h1&gt;</p>   

    <hr>

        </body>

</pre>
