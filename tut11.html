<!-- Tutorial 11: Semantic Tags
•	Task 1: Reconstruct your website layout using <header>, <nav>, <main>, and <footer> tags.
•	Task 2: Inside the <main> tag, create two separate <section> tags, each containing an <article>.
•	Task 3: Add an <aside> tag for a sidebar containing "Related Links". -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tut 11  semantic tags </title>
</head>
<body>
     <header><!--this is used for heading of the websites   -->
        <h1>this my website dont touch it you stupid ,ahh</h1>
    </header>

    <br>

    <nav>   <!-- this is used for the navigations of the websites -->
        <a href="kdefkw"></a>
        <a href="kdefkw"></a>
        <a href="kdefkw"></a>
        <a href="kdefkw"></a>
    </nav>

    <main>
        <section>
            <h3>sections one</h3>
            <article>
                <h3>article 1 </h3>
                <p>this first article iside the section one </p>
            </article>
        </section>
        <section>
            <h3>this IS Second section</h3>
            <article>
                <p>this para inside the second section</p>
            
            </article>
        </section>
        <br><hr><br>
        <!-- side bar -->
         <aside>
            <h2>related links</h2>
            <ul>
                <li><a href="fwfw">html Tutorial</a></li>
                <li><a href="fwfw"> cssTutorial</a></li>
                <li><a href="fwfw"> java Tutorial</a></li>
            </ul>
         </aside>
         </main>
<!-- Footer -->
    <footer>
        <p>&copy; 2026 My Website. All Rights Reserved.</p>
    </footer>
    
</body>
</html>
