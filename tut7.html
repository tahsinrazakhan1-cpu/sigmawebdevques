<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>

<body>

    <h1>User Registration Form</h1>
    <form>
        <!-- task one  takes username and password-->
        <label>username</label>
        <input type="username" placeholder="enter the username">
        <br><br>
        <label>password</label>
        <input type="password" placeholder="enter the password">
  
        <br><br>


        <!-- Task 2: Gender Radio Buttons -->

        <label>Gender</label>
        <input type="radio"> male
        <input type="radio">female
        <input type="radio" >other

        <br><br>

        <!-- Task 3: City Dropdown and Address Textarea -->

        <label for="city">select your city</label>
        <select >
            <option value="delhi">delhi</option>
            <option value="mumbai">mumbai</option>
            <option value="japur">japur</option>
            <option value="banglore0">banglore0</option>
            
        </select>

        <br><br>

        <label for="Address">Address</label>

        <textarea name="" id="" placeholder="enter your Address" rows="5" cols="30"></textarea>

        <br><br>

        <!-- Task 4: File Upload and Submit Button -->

        <label for="file">give us the file</label>
        <input type="file" >

        <br><br>
        <input type="submit" value="submit">

        <br>

    </form>

</body>

</html>
