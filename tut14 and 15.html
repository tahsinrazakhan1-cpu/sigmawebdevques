<!-- Tutorial 14 & 15: Introduction to CSS & Insertion

Task 1: Change a paragraph's color to red using inline CSS.

Task 2: Create a <style> tag in the head and change the background color of the entire body to yellow (internal CSS).

Task 3: Create a style.css file, link it to your HTML, and change all headings to blue (external CSS). -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>intr to css and insersetion</title>
    <style>
        body{
            background-color: rgba(202, 202, 33, 0.621);
        }
    </style>
    <link rel="stylesheet" href="tut14and15style.css">
</head>
<body>
    <h1>Welcome to css</h1>
    <!-- task 1 :inline css -->
     <p style="color: rgba(255, 0, 0, 0.382);">this line is with inline css color red </p>
    <h2>this heading is blue using the external css</h2>

    
</body>
</html>
